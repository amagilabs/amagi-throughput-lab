[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "amagi-throughput-lab"
version = "0.1.0"
description = "Find the llama-server (or vLLM) settings that serve the most people from one GPU: sweeps instances x --parallel x concurrency with distinct prompts, joins nvidia-smi power for tokens per joule, draws HTML/PNG charts and prints the command to run."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AmagiLabs (Amagisolutionsgroup, Inc.)", email = "dev@amagisolutionsgroup.com" }]
requires-python = ">=3.9"
dependencies = ["Pillow>=10.1"]
keywords = ["llm", "llama.cpp", "llama-server", "vllm", "throughput", "benchmark", "concurrency", "tokens-per-joule", "gpu", "localllama", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Benchmark",
]

[project.urls]
Homepage = "https://github.com/amagilabs/amagi-throughput-lab"

[project.scripts]
amagi-throughput-lab = "amagi_throughput_lab.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
